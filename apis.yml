name: Principality Building Society
kind: company
description: >-
  Principality Building Society is the largest building society in Wales and the
  sixth largest in the United Kingdom, founded in 1860 and headquartered in
  Cardiff. It is a mutual, owned by and run for the benefit of its members rather
  than shareholders, holding total assets of more than £11 billion and operating
  around 71 branches and agencies alongside internet and telephone channels. Its
  product range is deliberately narrow - savings, residential mortgages and
  investments, plus a commercial lending division - and it does NOT offer current
  or payment accounts. Principality is authorised by the Prudential Regulation
  Authority and regulated by the Financial Conduct Authority and the PRA, and is a
  member of the Building Societies Association. It is NOT one of the nine CMA9
  banks mandated to deliver UK Open Banking, and because it holds no payment
  accounts it falls outside the scope of the PSD2 / OBIE Read/Write (AIS, PIS,
  CBPII) standard. As of this profile Principality publishes no public developer
  portal and no confirmed OBIE Open Data API endpoint; the Open Banking API family
  below is represented as the shared Open Banking Implementation Entity (OBIE)
  standard for reference only, not as a Principality-operated contract.
