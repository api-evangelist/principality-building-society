apis:
- aid: principality-building-society:obie-account-transaction-api
  name: OBIE Account & Transaction Information API (AIS - Standard, Out of Scope)
  description: >-
    The OBIE Read/Write Account and Transaction Information (AISP) standard for reading account, balance
    and transaction data. FAPI-secured with OAuth2/OIDC, mutual-TLS and PSD2 strong customer authentication.
    Represented here as the documented OBIE standard only - Principality offers no current or payment
    accounts, publishes no ASPSP developer portal, and is therefore OUTSIDE the scope of this Read/Write
    API. No Principality base URL or credentials exist; none are invented.
  humanURL: https://github.com/OpenBankingUK/read-write-api-specs
  properties:
  - type: Documentation
    url: https://github.com/OpenBankingUK/read-write-api-specs
  - type: APIReference
    url: https://openbankinguk.github.io/read-write-api-site3/
  tags:
  - Account Information
  - AIS
  - PSD2
  - FAPI
- aid: principality-building-society:obie-payment-initiation-api
  name: OBIE Payment Initiation API (PIS - Standard, Out of Scope)
  description: >-
    The OBIE Read/Write Payment Initiation (PISP) standard for initiating domestic, scheduled, standing-order,
    international and file payments. FAPI-secured with OAuth2/OIDC, mutual-TLS and PSD2 strong customer
    authentication. Represented as the documented OBIE standard only - Principality holds no payment accounts
    and operates no PISP endpoint, so this is out of scope. No Principality host is fabricated.
  humanURL: https://github.com/OpenBankingUK/read-write-api-specs
  properties:
  - type: Documentation
    url: https://github.com/OpenBankingUK/read-write-api-specs
  - type: APIReference
    url: https://openbankinguk.github.io/read-write-api-site3/
  tags:
  - Payment Initiation
  - PIS
  - PSD2
  - FAPI
- aid: principality-building-society:obie-confirmation-of-funds-api
  name: OBIE Confirmation of Funds API (CBPII - Standard, Out of Scope)
  description: >-
    The OBIE Read/Write Confirmation of Funds (CBPII) standard for confirming whether funds are available
    on a payment account. FAPI-secured with OAuth2/OIDC, mutual-TLS and PSD2 strong customer authentication.
    Represented as the documented OBIE standard only - Principality offers no payment accounts and provides
    no CBPII endpoint. No Principality host is invented.
  humanURL: https://github.com/OpenBankingUK/read-write-api-specs
  properties:
  - type: Documentation
    url: https://github.com/OpenBankingUK/read-write-api-specs
  - type: APIReference
    url: https://openbankinguk.github.io/read-write-api-site3/
  tags:
  - Confirmation of Funds
  - CBPII
  - PSD2
  - FAPI
